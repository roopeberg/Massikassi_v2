services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: massikassi
      POSTGRES_USER: massikassi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massikassi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm migrate` to create/update tables.
  # Not part of `docker compose up` — doesn't need to run on every restart.
  migrate:
    build:
      context: .
      target: builder # has drizzle-kit + drizzle.config.ts; the final runner stage doesn't
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://massikassi:${POSTGRES_PASSWORD}@db:5432/massikassi
    depends_on:
      db:
        condition: service_healthy
    # Calling the local binary directly (not `npx drizzle-kit`) — npx failed to
    # resolve the already-installed local version and to auto-find
    # drizzle.config.ts in this image, for reasons not worth chasing further.
    entrypoint: ["node_modules/.bin/drizzle-kit", "push", "--force"]

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://massikassi:${POSTGRES_PASSWORD}@db:5432/massikassi
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      EMAIL_HMAC_SECRET: ${EMAIL_HMAC_SECRET:?set EMAIL_HMAC_SECRET in .env}
      MAIL_HOST: mail
      MAIL_PORT: 587
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    expose:
      - "3000"

  # Self-hosted outbound-only mail relay for the recovery-email feature
  # (lib/mail.ts) — no third-party email API, matching this project's "no
  # third party gets viewer/user data" pattern throughout. Only reachable
  # from other containers on this compose network, not exposed publicly.
  # See DEPLOY.md for the DNS records (SPF, DKIM, PTR) this needs to
  # actually land in inboxes, and the real deliverability risk of sending
  # from a non-datacenter IP even with those in place.
  mail:
    image: boky/postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${DOMAIN:?set DOMAIN in .env}
      POSTFIX_myhostname: mail.${DOMAIN:?set DOMAIN in .env}
      DKIM_AUTOGENERATE: "1"
    volumes:
      - mail_dkim:/etc/opendkim/keys
    expose:
      - "587"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
  mail_dkim:
